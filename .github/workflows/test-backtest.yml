name: Test backtest core
on:
  pull_request:
    paths:
      - "backtest.js"
      - "test_backtest.cjs"
      - "index.html"
      - ".github/workflows/test-backtest.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node test_backtest.cjs
