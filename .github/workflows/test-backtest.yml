name: Test backtest core
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test test*.cjs
      - run: node research_report.cjs --check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exercise the mobile UI against committed data
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python tests/mobile_smoke.py
