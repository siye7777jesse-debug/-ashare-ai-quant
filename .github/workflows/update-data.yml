name: Refresh public A-share history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-data.yml"
      - "update_data.py"
      - "update_stocks.py"
  schedule:
    - cron: "30 11 * * 1-5"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline parser tests
        run: python -m unittest -v test_update_data.py
      - name: Test public stock directory parser
        run: python -m unittest -v test_update_stocks.py
      - name: Install optional exchange directory fallback
        continue-on-error: true
        run: python -m pip install --quiet akshare
      - name: Refresh public A-share name directory
        id: names
        continue-on-error: true
        run: python update_stocks.py
      - name: Fetch public daily bars
        id: prices
        continue-on-error: true
        run: python update_data.py
      - name: Confirm public data was fetched
        if: steps.names.outcome == 'failure' && steps.prices.outcome == 'failure'
        run: |
          echo "Both public APIs failed; existing data has not been replaced."
          exit 1
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh A-share daily bars"
            git push
          fi
